<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta - Pantalla de búsqueda por código</title>
<style>
  /* Estilos que replican el diseño actual de la app (Home.module.css + MUI) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', system-ui, 'Segoe UI', sans-serif; background: #fff; color: rgba(0,0,0,.87); }
  .ribbon { background: #fff4d6; color: #6a4b00; text-align: center; padding: 6px 12px; font-size: .8rem; border-bottom: 1px solid #f0d890; }
  header.top { display: grid; grid-template-columns: 1fr 1fr; justify-items: right; align-items: center; gap: 1rem; padding: .5rem; font-size: .85rem; color: rgb(65,65,65); background: #f8f8f8b3; }
  header.top .title { justify-self: end; }
  header.top h1 { font-size: 1.5rem; font-weight: bolder; white-space: nowrap; }
  header.top button { background: none; border: 0; color: #1976d2; font: 500 .875rem Roboto, sans-serif; text-transform: uppercase; padding: 6px 16px 6px 8px; cursor: pointer; }
  .controls { display: grid; align-items: center; grid-template-columns: 1.5fr 1fr; gap: 10px; padding: 1rem; font-size: .95rem; }
  .search { position: relative; border-radius: 4px; background: #F8F8F8; width: 100%; margin-left: 8px; }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; fill: rgba(0,0,0,.54); pointer-events: none; }
  .search input { width: 100%; border: 0; background: transparent; font: 400 1rem Roboto, sans-serif; padding: 8px 8px 8px calc(1em + 32px); outline: none; }
  .actions { display: flex; align-items: center; gap: .25rem; justify-content: right; }
  .mbtn { border: 0; border-radius: 4px; padding: 6px 16px; font: 500 .875rem Roboto, sans-serif; letter-spacing: .02857em; text-transform: uppercase; cursor: pointer; background: #1976d2; color: #fff; box-shadow: 0 3px 1px -2px rgba(0,0,0,.2),0 2px 2px 0 rgba(0,0,0,.14),0 1px 5px 0 rgba(0,0,0,.12); white-space: nowrap; }
  .mbtn:hover { background: #1565c0; }
  .mbtn.text { background: none; color: #1976d2; box-shadow: none; padding: 5px 8px; }
  .mbtn.text:hover { background: rgba(25,118,210,.04); }
  /* ESPACIO NUEVO: misma estética que el buscador actual */
  .codeRow { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; padding: 0 1rem 1rem; align-items: center; }
  .codeSearch { position: relative; border-radius: 4px; background: #F8F8F8; margin-left: 8px; }
  .codeSearch svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; fill: rgba(0,0,0,.54); pointer-events: none; }
  .codeSearch input { width: 100%; border: 0; background: transparent; font: 400 1rem Roboto, sans-serif; padding: 8px 8px 8px calc(1em + 32px); outline: none; text-transform: uppercase; }
  .codeSearch input::placeholder { text-transform: none; }
  .newTag { position: absolute; right: 8px; top: -9px; background: #1976d2; color: #fff; font-size: .62rem; padding: 1px 6px; border-radius: 99px; letter-spacing: .05em; }
  @media (max-width: 760px) { .controls, .codeRow { grid-template-columns: 1fr; } }
  #resultado { padding: 0; }
  .result { display: flex; align-items: center; gap: 12px; background: #F8F8F8; border-radius: 4px; padding: 10px 12px; }
  .result.notfound { color: #b3261e; }
  .result .thumb { width: 80px; height: 56px; border-radius: 4px; background: linear-gradient(135deg,#b0bec5,#eceff1); display: grid; place-items: center; font-size: 1.5rem; flex: none; }
  .result .info { flex: 1; }
  .result h3 { font-size: 1.1rem; font-weight: 400; }
  .result small { color: rgba(0,0,0,.6); font-size: .875rem; }
  .labsContainer { margin: .1rem 0 0; padding: 1rem; background: #F8F8F8; width: 100%; border-radius: 5px; display: grid; justify-items: center; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); grid-auto-rows: min-content; gap: 1rem; }
  .card { width: 345px; max-width: 100%; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12); }
  .card .media { height: 250px; display: grid; place-items: center; font-size: 3rem; background: linear-gradient(135deg,#b0bec5,#eceff1); }
  .card .content { padding: 16px; }
  .card .name { font-size: 1.2rem; letter-spacing: 1.2px; color: #000; margin-bottom: .35em; }
  .card .name:hover { color: #1976d2; cursor: pointer; }
  .card .desc { font-size: .875rem; color: rgba(0,0,0,.6); line-height: 1.43; }
  .card .cardActions { padding: 8px; }
  #drawer { position: fixed; right: 0; top: 4.5rem; height: calc(100% - 4.5rem); width: 420px; max-width: 100vw; background: #fff; border-radius: 8px 0 0 0; box-shadow: -4px 0 16px rgba(0,0,0,.25); padding: 16px; display: flex; flex-direction: column; gap: 16px; transform: translateX(105%); transition: transform .25s; z-index: 20; overflow-y: auto; }
  #drawer.open { transform: none; }
  .dHead { display: flex; justify-content: space-between; align-items: center; }
  .dHead h2 { font-size: 1.25rem; font-weight: 500; }
  .dHead button { border: 0; background: none; font-size: 1.1rem; cursor: pointer; }
  .dInput { background: #F8F8F8; border-radius: 4px; padding: 4px 12px; }
  .dInput input { width: 100%; border: 0; background: transparent; font: 400 1rem Roboto, sans-serif; padding: 8px 0; outline: none; text-transform: uppercase; }
  .dInput input::placeholder { text-transform: none; }
  .dActions { display: flex; gap: 4px; }
  .mbtn.out { background: #fff; color: #1976d2; box-shadow: none; border: 1px solid rgba(25,118,210,.5); }
  .rcard { border-radius: 4px; box-shadow: 0 2px 1px -1px rgba(0,0,0,.2),0 1px 1px 0 rgba(0,0,0,.14),0 1px 3px 0 rgba(0,0,0,.12); overflow: hidden; flex-shrink: 0; }
  .rcard .img { height: 200px; display: grid; place-items: center; font-size: 3.5rem; background: linear-gradient(135deg,#b0bec5,#eceff1); }
  .rcard .body { padding: 16px; }
  .rcard h3 { font-size: 1.25rem; font-weight: 500; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; padding: 3px 0; font-size: .875rem; }
  .row .l { min-width: 150px; color: rgba(0,0,0,.6); }
  .row .v.none { color: rgba(0,0,0,.38); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #323232; color: #fff; padding: 10px 18px; border-radius: 4px; font-size: .9rem; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="ribbon">MAQUETA VISUAL · datos de ejemplo · el diseño actual se mantiene; solo se agrega la fila de código (marcada como NUEVO)</div>

<header class="top">
  <div class="title"><h1>Inventario de laboratorios</h1></div>
  <div><button type="button">Cerrar Sesión</button></div>
</header>

<div class="controls">
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="buscar" type="text" placeholder="Buscar..." aria-label="search">
  </div>
  <div class="actions">
    <button class="mbtn" type="button">Agregar laboratorio</button>
    <button class="mbtn" type="button">⬇ Exportar todo</button>
  </div>
</div>

<div class="codeRow" style="grid-template-columns:1fr">
  <div class="actions">
    <span class="newTag" style="position:static;margin-right:6px">NUEVO</span>
    <button class="mbtn" id="btnAbrir" type="button">Buscar código</button>
  </div>
</div>

<aside id="drawer" aria-label="Buscar por código">
  <div class="dHead"><h2>Buscar por código</h2><button type="button" id="btnCerrar" aria-label="cerrar">✕</button></div>
  <div class="dInput"><input id="codigo" type="text" placeholder="Código del equipo (escribe o escanea)" autocomplete="off"></div>
  <div class="dActions">
    <button class="mbtn" id="btnBuscar" type="button">Buscar</button>
    <button class="mbtn out" id="btnPdf" type="button">Generar código (PDF)</button>
  </div>
  <div id="resultado" aria-live="polite"></div>
</aside>

<div class="labsContainer" id="labs"></div>

<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Datos de ejemplo (en la app real vendrán de Firestore)
  const LABS = [
    { n: 'Laboratorio de Redes 1', d: 'Equipos de networking y cableado', e: '🌐' },
    { n: 'Laboratorio de Química', d: 'Suministros, reactivos y cristalería', e: '🧪' },
    { n: 'Laboratorio de Electrónica', d: 'Osciloscopios, fuentes y herramientas', e: '🔌' },
    { n: 'Laboratorio de Cómputo', d: 'Equipos de escritorio y servidores', e: '💻' },
    { n: 'Laboratorio de Física', d: 'Instrumentos de medición', e: '⚛️' },
    { n: 'Laboratorio de Biología', d: 'Microscopios y material biológico', e: '🔬' }
  ];
  const ITEMS = {
    'INV-000123': { equipo: 'Router Cisco 2901', lab: 'Laboratorio de Redes 1', tipo: 'Equipo', marca: 'Cisco', modelo: '2901', cantidad: '2', ubic: 'Estante A', col: 'Columna 2', obs: '', e: '📡' },
    'INV-000045': { equipo: 'Microscopio óptico', lab: 'Laboratorio de Biología', tipo: 'Equipo', marca: 'Olympus', modelo: 'CX23', cantidad: '5', ubic: 'Gabinete 3', col: '', obs: 'Requiere calibración', e: '🔬' },
    'INV-000207': { equipo: 'Osciloscopio digital', lab: 'Laboratorio de Electrónica', tipo: 'Equipo', marca: 'Rigol', modelo: '', cantidad: '1', ubic: 'Mesa 5', col: 'B', obs: '', e: '📈' }
  };

  const $ = (id) => document.getElementById(id);

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function pintarLabs(filtro) {
    const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const f = norm((filtro || '').trim());
    const html = LABS
      .filter((l) => norm(l.n).includes(f))
      .map((l) => '<div class="card"><div class="media">' + l.e + '</div>' +
        '<div class="content"><div class="name">' + l.n + '</div><div class="desc">' + l.d + '</div></div>' +
        '<div class="cardActions"><button class="mbtn text" type="button">Opciones</button></div></div>')
      .join('');
    $('labs').innerHTML = html || 'No hay laboratorios con ese nombre.';
  }
  $('buscar').addEventListener('input', (e) => pintarLabs(e.target.value));
  pintarLabs('');

  function limpiarCodigo(v) { return (v || '').trim().toUpperCase(); }

  function buscarCodigo() {
    const c = limpiarCodigo($('codigo').value);
    const out = $('resultado');
    if (!c) { out.innerHTML = ''; toast('Escribe o escanea un código primero'); return; }
    const it = ITEMS[c];
    if (!it) {
      out.innerHTML = '<div class="result notfound">Código <strong>' + c + '</strong> no encontrado.</div>';
      return;
    }
    const filas = [['Código', c], ['Laboratorio', it.lab], ['Marca', it.marca], ['Modelo', it.modelo], ['Tipo', it.tipo],
      ['Cantidad', it.cantidad], ['Ubicación', it.ubic], ['Columna de localización', it.col], ['Observaciones', it.obs]]
      .map(([l, v]) => '<div class="row"><span class="l">' + l + ':</span><span class="v' + (v ? '' : ' none') + '">' + (v || 'Sin datos') + '</span></div>')
      .join('');
    out.innerHTML = '<div class="rcard"><div class="img">' + it.e + '</div><div class="body"><h3>' + it.equipo + '</h3>' + filas +
      '<button class="mbtn text" type="button" id="btnDetalle">Ir al laboratorio</button></div></div>';
    $('btnDetalle').addEventListener('click', () => toast('En la app real: abre el laboratorio del equipo'));
  }
  $('btnAbrir').addEventListener('click', () => { $('drawer').classList.add('open'); $('codigo').focus(); });
  $('btnCerrar').addEventListener('click', () => $('drawer').classList.remove('open'));
  $('btnBuscar').addEventListener('click', buscarCodigo);
  // El escáner USB escribe el código y envía Enter
  $('codigo').addEventListener('keydown', (e) => { if (e.key === 'Enter') { buscarCodigo(); $('codigo').select(); } });

  // PDF rápido de la etiqueta (50x30 mm)
  function generarPdf() {
    const c = limpiarCodigo($('codigo').value);
    if (!c) { toast('Escribe un código para generar el PDF'); $('codigo').focus(); return; }
    if (!window.JsBarcode || !window.jspdf) { toast('No se pudieron cargar las librerías (se requiere internet)'); return; }
    const it = ITEMS[c];
    const canvas = document.createElement('canvas');
    try {
      JsBarcode(canvas, c, { format: 'CODE128', width: 3, height: 90, displayValue: true, fontSize: 28, margin: 10 });
    } catch (err) {
      toast('Código no válido para código de barras'); return;
    }
    const { jsPDF } = window.jspdf;
    const W = 50, H = 30;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [W, H] });
    pdf.setFontSize(6);
    pdf.text((it ? it.lab : 'Laboratorio').slice(0, 40), W / 2, 4, { align: 'center' });
    pdf.setFontSize(8);
    pdf.text((it ? it.equipo : 'Equipo').slice(0, 32), W / 2, 8, { align: 'center' });
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 3, 10, W - 6, H - 12);
    pdf.save('etiqueta-' + c + '.pdf');
    toast('PDF generado: etiqueta-' + c + '.pdf');
  }
  $('btnPdf').addEventListener('click', generarPdf);
</script>
</body>
</html>
